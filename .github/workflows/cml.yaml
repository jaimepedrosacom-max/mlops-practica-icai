name: MLOps with CML

on: [push, pull_request]

jobs:
  train-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml
          pip install -r requirements.txt

      - name: Pull data with DVC
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_API_KEY }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user $DAGSHUB_USERNAME
          dvc remote modify origin --local password $DAGSHUB_TOKEN
          dvc pull data/iris_dataset.csv

      - name: Run training script
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_API_KEY }}
        run: |
          dvc repro

  deploy-to-gke:
    needs: train-and-report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: DVC and Python setup
        uses: iterative/setup-dvc@v1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # Genera un kubeconfig con token de acceso a partir de la autenticación anterior.
      # No depende de gke-gcloud-auth-plugin (origen del fallo de credenciales en kubectl).
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: mlops-gke-cluster
          location: us-central1-a
          project_id: ing-modelos-icai-2026

      - name: Check cluster access
        run: |
          kubectl config current-context
          kubectl get nodes
          if [ "$(kubectl auth can-i create deployments)" != "yes" ]; then
            echo "::error::La service account no puede crear Deployments. Dale el rol 'Kubernetes Engine Developer' o 'Kubernetes Engine Admin' en IAM."
            exit 1
          fi

      - name: DVC Pull
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_API_KEY }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user $DAGSHUB_USERNAME
          dvc remote modify origin --local password $DAGSHUB_TOKEN
          dvc pull

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Docker to use GCR
        run: gcloud auth configure-docker

      - name: Build and Push API Docker Image
        run: |
          docker build -t gcr.io/ing-modelos-icai-2026/mlops-api:latest .
          docker push gcr.io/ing-modelos-icai-2026/mlops-api:latest

      - name: Build and Push Web Docker Image
        run: |
          docker build -t gcr.io/ing-modelos-icai-2026/mlops-web:latest -f Dockerfile.web .
          docker push gcr.io/ing-modelos-icai-2026/mlops-web:latest

      - name: Deploy to GKE
        run: |
          kubectl apply -f api-deployment.yaml
          kubectl apply -f api-service.yaml
          kubectl apply -f web-deployment.yaml
          kubectl apply -f web-service.yaml
          # Con la etiqueta :latest el manifiesto no cambia, así que forzamos que se descarguen las imágenes nuevas
          kubectl rollout restart deployment/mlops-api-deployment deployment/mlops-web-deployment
          kubectl rollout status deployment/mlops-api-deployment --timeout=300s
          kubectl rollout status deployment/mlops-web-deployment --timeout=300s
          kubectl get pods,svc

      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl logs deployment/mlops-api-deployment --tail=50 || true
          kubectl logs deployment/mlops-web-deployment --tail=50 || true